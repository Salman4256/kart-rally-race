<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141836"/>
      <stop offset="50%" stop-color="#2a1f52"/>
      <stop offset="100%" stop-color="#0c0e22"/>
    </linearGradient>
    <linearGradient id="kartGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#e52521"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Speed lines -->
  <path d="M 40 210 L 260 210" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 20 270 L 200 270" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 60 330 L 220 330" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>

  <!-- Checkered Flag banner -->
  <g transform="translate(290, 80) rotate(15) scale(0.9)">
    <rect x="0" y="0" width="30" height="30" fill="#fff"/>
    <rect x="30" y="0" width="30" height="30" fill="#111"/>
    <rect x="60" y="0" width="30" height="30" fill="#fff"/>
    <rect x="0" y="30" width="30" height="30" fill="#111"/>
    <rect x="30" y="30" width="30" height="30" fill="#fff"/>
    <rect x="60" y="30" width="30" height="30" fill="#111"/>
    <rect x="0" y="60" width="30" height="30" fill="#fff"/>
    <rect x="30" y="60" width="30" height="30" fill="#111"/>
    <rect x="60" y="60" width="30" height="30" fill="#fff"/>
  </g>

  <!-- Turbo Kart Graphic -->
  <g transform="translate(130, 160)">
    <!-- Wheels -->
    <rect x="25" y="170" width="45" height="75" rx="18" fill="#181818" stroke="#ffd23f" stroke-width="6"/>
    <rect x="195" y="170" width="45" height="75" rx="18" fill="#181818" stroke="#ffd23f" stroke-width="6"/>
    <rect x="15" y="35" width="40" height="65" rx="16" fill="#181818" stroke="#ffd23f" stroke-width="5"/>
    <rect x="205" y="35" width="40" height="65" rx="16" fill="#181818" stroke="#ffd23f" stroke-width="5"/>

    <!-- Kart Chassis -->
    <path d="M 65 200 L 195 200 L 180 50 L 80 50 Z" fill="url(#kartGrad)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <!-- Racing Stripe -->
    <path d="M 115 200 L 145 200 L 140 50 L 120 50 Z" fill="#ffffff"/>

    <!-- Wing -->
    <rect x="50" y="210" width="160" height="26" rx="10" fill="#ffd23f" stroke="#111" stroke-width="4"/>

    <!-- Driver Helmet -->
    <circle cx="130" cy="115" r="32" fill="#ffd23f" stroke="#ffffff" stroke-width="5"/>
    <ellipse cx="130" cy="118" rx="22" ry="14" fill="#141836"/>
  </g>

  <!-- Golden Trophy Icon Overlay -->
  <g transform="translate(70, 70) scale(0.95)">
    <path d="M 10 20 L 70 20 L 60 70 C 56 90 24 90 20 70 Z" fill="url(#gold)" stroke="#fff" stroke-width="4"/>
    <path d="M 10 30 C -8 30 -8 55 12 55" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <path d="M 70 30 C 88 30 88 55 68 55" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <rect x="35" y="85" width="10" height="20" fill="url(#gold)"/>
    <rect x="20" y="105" width="40" height="12" rx="4" fill="url(#gold)" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- App Title text banner -->
  <text x="256" y="445" font-family="'Lilita One', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffd23f" text-anchor="middle" letter-spacing="2" stroke="#000" stroke-width="6" paint-order="stroke fill">TURBO KART</text>
</svg>
